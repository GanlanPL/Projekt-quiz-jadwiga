<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Czy aby nie jesteś mugolem?</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0c10;
      --panel-bg: #12161f;
      --card-bg: #181d28;
      --accent-green: #1a4d3e;
      --accent-emerald: #2d8a6e;
      --gold-dark: #8c733e;
      --gold-light: #c5a059;
      --text-light: #d1d5db;
      --text-dim: #8b949e;
      --border-dark: #262c3a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'EB Garamond', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 50% 0%, #1a2332 0%, transparent 75%),
        radial-gradient(circle at 50% 100%, #05070a 0%, transparent 100%);
    }

    h1, h2, h3, h4 {
      font-family: 'Cinzel', serif;
      letter-spacing: 1px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      margin-top: 10px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--gold-light);
      text-shadow: 0 0 10px rgba(197, 160, 89, 0.2);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-dim);
      font-style: italic;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      gap: 30px;
      width: 100%;
      max-width: 900px;
    }

    @media (min-width: 850px) {
      .main-container {
        display: grid;
        grid-template-columns: 320px 1fr;
      }
    }

    .puzzle-section {
      background: var(--panel-bg);
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .puzzle-title {
      font-size: 1.1rem;
      color: var(--gold-light);
      margin-bottom: 15px;
      text-align: center;
    }

    .puzzle-container {
      width: 250px;
      height: 444px;
      position: relative;
      background-color: #000;
      border: 2px solid var(--gold-dark);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      transition: transform 0.3s ease;
    }

    .puzzle-container.zoomable {
      cursor: pointer;
    }

    .puzzle-container.zoomable:hover {
      transform: scale(1.03);
      border-color: var(--gold-light);
      box-shadow: 0 0 25px rgba(197, 160, 89, 0.4);
    }

    .secret-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .puzzle-grid {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
    }

    .puzzle-piece {
      flex: 1;
      width: 100%;
      background: #0d1117;
      border-bottom: 1px solid #1a202c;
      transition: all 0.8s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38444d;
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      position: relative;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .puzzle-piece::before {
      content: "🔒 Tajemnica " attr(data-index);
    }

    .puzzle-piece.unlocked {
      background: transparent !important;
      border-color: transparent;
      box-shadow: none;
    }

    .puzzle-piece.unlocked::before {
      content: "";
    }

    .menu-section {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .character-card {
      background: var(--card-bg);
      border: 1px solid var(--border-dark);
      border-radius: 6px;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: all 0.3s ease;
      position: relative;
    }

    .character-card.available {
      border-color: var(--accent-emerald);
      cursor: pointer;
    }

    .character-card.available:hover {
      background: #1e2534;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(45, 138, 110, 0.2);
    }

    .character-card.completed {
      border-color: var(--gold-dark);
      opacity: 0.8;
    }

    .character-card.locked {
      opacity: 0.4;
      filter: grayscale(80%);
      cursor: not-allowed;
    }

    .char-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #0d1117;
      border: 1px solid var(--border-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .char-info { flex: 1; }
    .char-name { font-size: 1.2rem; color: #e5e7eb; }
    .char-day { font-size: 0.85rem; color: var(--text-dim); }

    .status-badge {
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: 'Cinzel', serif;
    }

    .badge-locked { background: #222; color: #666; }
    .badge-ready { background: var(--accent-green); color: #6ee7b7; }
    .badge-done { background: #3a2e19; color: var(--gold-light); }

    .modal-overlay {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: var(--panel-bg);
      border: 1px solid var(--gold-dark);
      border-radius: 8px;
      max-width: 500px;
      width: 100%;
      padding: 25px;
      box-shadow: 0 0 30px rgba(0,0,0,0.9);
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 10px; right: 15px;
      background: none; border: none;
      color: var(--text-dim);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .question-box { margin: 20px 0; }
    .question-title { font-size: 1.1rem; margin-bottom: 12px; color: #fff; }

    .options-list { display: flex; flex-direction: column; gap: 10px; }
    
    .option-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-dark);
      color: var(--text-light);
      padding: 12px 15px;
      border-radius: 4px;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .option-btn:hover { 
      background: #232a3a; 
      border-color: var(--accent-emerald); 
      color: #fff;
    }

    .option-letter {
      font-family: 'Cinzel', serif;
      font-weight: bold;
      color: var(--gold-light);
      background: rgba(0,0,0,0.3);
      padding: 2px 8px;
      border-radius: 3px;
    }

    .quiz-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: var(--text-dim);
    }

    .quiz-result { text-align: center; padding: 20px 0; }
    .quiz-result h3 { color: var(--gold-light); margin-bottom: 10px; }

    /* Modal powiększenia zdjęcia */
    .image-modal-content {
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
    }

    .full-image {
      max-width: 100%;
      max-height: 85vh;
      border: 3px solid var(--gold-light);
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(197, 160, 89, 0.5);
      object-fit: contain;
    }

    .dev-panel {
      margin-top: 40px;
      padding: 15px;
      background: #080a0d;
      border: 1px dashed #333;
      border-radius: 6px;
      width: 100%;
      max-width: 900px;
      font-size: 0.85rem;
    }

    .dev-panel summary { cursor: pointer; color: var(--text-dim); }
    .dev-controls { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px; }
    .dev-btn { background: #222; color: #ccc; border: 1px solid #444; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>Czy aby nie jesteś mugolem?</h1>
    <p>Pięć prób. Pięć tajemnic. Odkryj sekrety, by poznać prawdę.</p>
  </header>

  <div class="main-container">
    <div class="puzzle-section">
      <div class="puzzle-title" id="puzzleTitle">Odkryty Wizerunek</div>
      <div class="puzzle-container" id="puzzleContainer">
        <img id="secretImage" class="secret-img" src="https://i.postimg.cc/QdyLRS12/selfie.png" alt="Obraz Tajemnica">
        <div class="puzzle-grid">
          <div class="puzzle-piece" id="piece-4" data-index="5"></div>
          <div class="puzzle-piece" id="piece-3" data-index="4"></div>
          <div class="puzzle-piece" id="piece-2" data-index="3"></div>
          <div class="puzzle-piece" id="piece-1" data-index="2"></div>
          <div class="puzzle-piece" id="piece-0" data-index="1"></div>
        </div>
      </div>
    </div>

    <div class="menu-section" id="cardsList"></div>
  </div>

  <!-- Modal do Quizu -->
  <div class="modal-overlay" id="quizModal">
    <div class="modal-content">
      <button class="close-btn" id="closeBtn">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Modal do powiększonego zdjęcia -->
  <div class="modal-overlay" id="imageModal">
    <div class="modal-content image-modal-content">
      <button class="close-btn" id="closeImageBtn" style="color: #fff; font-size: 2rem;">×</button>
      <img src="https://i.postimg.cc/QdyLRS12/selfie.png" alt="Powiększone zdjęcie" class="full-image">
    </div>
  </div>

  <details class="dev-panel">
    <summary>🛠️ Panel Testowy (Symulacja dni i reset)</summary>
    <div class="dev-controls">
      <button class="dev-btn" onclick="setDevDay(1)">Dzień 1</button>
      <button class="dev-btn" onclick="setDevDay(2)">Dzień 2</button>
      <button class="dev-btn" onclick="setDevDay(3)">Dzień 3</button>
      <button class="dev-btn" onclick="setDevDay(4)">Dzień 4</button>
      <button class="dev-btn" onclick="setDevDay(5)">Dzień 5</button>
      <button class="dev-btn" onclick="resetProgress()" style="color:#f87171">Reset Postępu</button>
    </div>
  </details>

  <script>
    const CHARACTERS = [
      {
        id: "hagrid",
        name: "Rubeus Hagrid",
        day: 1,
        icon: "🗝️",
        questions: [
          { q: "Gdzie Hagrid zdobył smocze jajo w pierwszej części przygód o Harrym?", answers: ["Karczma pod Świńskim Łbem", "Piwnica pod Trzema Miotłami", "Znalazł w lesie", "Sam urodził po swoich legandarnych babeczkach"], correct: 0 },
          { q: "Gdzie Hagrid trzymał szczątki swojej różdżki?", answers: ["W majtkach", "W płaszczu", "W parasolce", "Nie miał różdżki"], correct: 2 },
          { q: "Jak na imię miał przyrodni brat Hagrida?", answers: ["Gnat", "Gordin", "Penelopa", "Graup"], correct: 3 },
          { q: "Za co wyrzucili Hagrida ze szkoły?", answers: ["Za śpiewanie pod prysznicem", "Za podwędzenie wędliny z szkolnej stołówki", "Rasizm na tle wielkościowym", "Został wrobiony w coś czego nie zrobił... Żydy."], correct: 3 }
        ]
      },
      {
        id: "harry",
        name: "Harry Potter",
        day: 2,
        icon: "⚡",
        questions: [
          { q: "Jakiej marki miotłę Harry otrzymał od Syriusza po utracie Nimbusa 2000?", answers: ["Nimbus 2001", "Kometa 290", "Błyskawica", "Srebrna Strzała"], correct: 2 },
          { q: "Jak miał na imię mugolski sąsiad Harry'ego, którego Dudley i jego gang regularnie prześladowali?", answers: ["Mark Evans", "Dennis Creevey", "Piers Polkiss", "Nigel Wolpert"], correct: 0 },
          { q: "Co znajdowało się w złotym zniczu pozostawionym Harry'emu przez Dumbledore'a?", answers: ["Fragment mapy", "Kamień Wskrzeszenia", "Włos feniksa", "Czarna perła"], correct: 1 },
          { q: "Którego ze swoich nauczycieli Harry jako pierwszy rozbroił zaklęciem Expelliarmus?", answers: ["Snape'a", "Lupina", "Lockharta", "Moody'ego"], correct: 2 }
        ]
      },
      {
        id: "snape",
        name: "Severus Snape",
        day: 3,
        icon: "🧪",
        questions: [
          { q: "Jakie było drugie imię Snape'a?", answers: ["Tobiasz", "Nie posiadał drugiego imienia", "Eileen", "Septimus"], correct: 1 },
          { q: "Jak miał na imię ojciec Snape'a?", answers: ["Tobias Snape", "Thomas Snape", "Terrence Snape", "Tristan Snape"], correct: 0 },
          { q: "Jaką nazwę przybrał Snape jako autor notatek w podręczniku eliksirów?", answers: ["Mistrz Eliksirów", "Półkrwi Książę", "Czarny Mag", "Książę Slytherinu"], correct: 1 },
          { q: "Jakiego zaklęcia Snape użył, aby przeciąć ucho George'a podczas ucieczki z Privet Drive?", answers: ["Sectumsempra", "Diffindo", "Confringo", "Reducto"], correct: 0 }
        ]
      },
      {
        id: "hermione",
        name: "Hermiona Granger",
        day: 4,
        icon: "📚",
        questions: [
          { q: "Jak nazywał się kot Hermiony?", answers: ["Krzywołap", "Puszek", "Łapa", "Kieł"], correct: 0 },
          { q: "Ile SUM-ów zdobyła Hermiona?", answers: ["9", "10", "11", "12"], correct: 2 },
          { q: "W jakiej sytuacji Hermiona pocałowała Rona po raz pierwszy?", answers: ["Była pod wpływem eliksiru miłości.", "Okazało się że Ron tylko udaje że jest biedny a tak naprawdę jest bogatszy od Malfoja.", "Ron okazał się nie być egoistycznym śmieciem, gdyż chciał uratować skrzaty domowe przed walką.", "Nigdy go nie pocałowała bo był rudy."], correct: 2 },
          { q: "Której książki Hermiona użyła do uwarzenia Eliksiru Wielosokowego w drugiej części?", answers: ["Zaawansowane Warzenie Eliksirów", "Eliksiry dla Zaawansowanych", "Najsilniejsze Mikstury", "Sekrety Czarnej Magii"], correct: 2 }
        ]
      },
      {
        id: "dumbledore",
        name: "Albus Dumbledore",
        day: 5,
        icon: "🪄",
        questions: [
          { q: "Jak miał na drugie imię Albus Dumbledore?", answers: ["Brian", "Percival", "Wulfric", "Wszystkie powyższe"], correct: 0 },
          { q: "Które z poniższych smakołyków było hasłem otwierającym przejście do gabinetu Dumbledore?", answers: ["Cytrynowy Sorbet", "Kociołkowe Pieguski", "Pudding Brzoskwiniowy", "Czekoladowe Żaby"], correct: 0 },
          { q: "Z kim Dumbledore pokonał Grindelwalda?", answers: ["Samodzielnie", "Razem z Newtem Scamanderem", "Razem z Aberforthem", "Razem z Nicolasem Flamelem"], correct: 0 },
          { q: "Jaki smak dżemu wspomniał Dumbledore tuż przed śmiercią?", answers: ["Truskawkowy", "Malinowy", "Nie wspomniał żadnego dżemu", "Morelowy"], correct: 2 }
        ]
      }
    ];

    let userState = JSON.parse(localStorage.getItem('hp_quiz_state')) || {
      completed: [],
      devDayOffset: 0,
      startDate: new Date().getTime()
    };

    function saveState() {
      localStorage.setItem('hp_quiz_state', JSON.stringify(userState));
    }

    function getCurrentDay() {
      if (userState.devDayOffset > 0) return userState.devDayOffset;
      const now = new Date().getTime();
      const diffTime = Math.abs(now - userState.startDate);
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
      return diffDays;
    }

    function renderApp() {
      const currentDay = getCurrentDay();
      const cardsList = document.getElementById('cardsList');
      cardsList.innerHTML = '';

      CHARACTERS.forEach((char, index) => {
        const isCompleted = userState.completed.includes(char.id);
        const isDayUnlocked = currentDay >= char.day;
        const isPreviousCompleted = index === 0 || userState.completed.includes(CHARACTERS[index - 1].id);
        const isAvailable = isDayUnlocked && isPreviousCompleted && !isCompleted;

        const card = document.createElement('div');
        let cardClass = 'character-card ';
        let badgeHtml = '';

        if (isCompleted) {
          cardClass += 'completed';
          badgeHtml = '<span class="status-badge badge-done">Ukończono</span>';
        } else if (isAvailable) {
          cardClass += 'available';
          badgeHtml = '<span class="status-badge badge-ready">Dostępny</span>';
          card.onclick = () => startQuiz(char);
        } else {
          cardClass += 'locked';
          const reason = !isDayUnlocked ? `Dzień ${char.day}` : 'Zaliczy poprzednie';
          badgeHtml = `<span class="status-badge badge-locked">🔒 ${reason}</span>`;
        }

        card.className = cardClass;
        card.innerHTML = `
          <div class="char-avatar">${char.icon}</div>
          <div class="char-info">
            <div class="char-name">${char.name}</div>
            <div class="char-day">Etap ${char.day} z 5</div>
          </div>
          ${badgeHtml}
        `;
        cardsList.appendChild(card);

        const piece = document.getElementById(`piece-${index}`);
        if (isCompleted) {
          piece.classList.add('unlocked');
        } else {
          piece.classList.remove('unlocked');
        }
      });

      const allCompleted = userState.completed.length === CHARACTERS.length;
      const puzzleContainer = document.getElementById('puzzleContainer');
      const puzzleTitle = document.getElementById('puzzleTitle');

      if (allCompleted) {
        puzzleContainer.classList.add('zoomable');
        puzzleTitle.innerText = "🔍 Odkryty Wizerunek (Kliknij, aby powiększyć)";
        puzzleContainer.onclick = openImageModal;
      } else {
        puzzleContainer.classList.remove('zoomable');
        puzzleTitle.innerText = "Odkryty Wizerunek";
        puzzleContainer.onclick = null;
      }
    }

    function openImageModal() {
      document.getElementById('imageModal').style.display = 'flex';
    }

    document.getElementById('closeImageBtn').onclick = () => {
      document.getElementById('imageModal').style.display = 'none';
    };

    let activeChar = null;
    let currentQ = 0;
    let score = 0;
    const letters = ['A', 'B', 'C', 'D'];

    function startQuiz(char) {
      activeChar = char;
      currentQ = 0;
      score = 0;
      document.getElementById('quizModal').style.display = 'flex';
      window.addEventListener('keydown', handleKeyPress);
      renderQuestion();
    }

    function closeQuiz() {
      document.getElementById('quizModal').style.display = 'none';
      window.removeEventListener('keydown', handleKeyPress);
    }

    document.getElementById('closeBtn').onclick = closeQuiz;

    function handleKeyPress(e) {
      const key = e.key.toUpperCase();
      const keyMap = { 'A': 0, 'B': 1, 'C': 2, 'D': 3, '1': 0, '2': 1, '3': 2, '4': 3 };
      if (keyMap.hasOwnProperty(key)) {
        handleAnswer(keyMap[key]);
      }
    }

    function renderQuestion() {
      const qData = activeChar.questions[currentQ];
      const modalBody = document.getElementById('modalBody');

      modalBody.innerHTML = `
        <h3>${activeChar.name} — Pytanie ${currentQ + 1}/4</h3>
        <div class="question-box">
          <div class="question-title">${qData.q}</div>
          <div class="options-list" id="optionsContainer"></div>
        </div>
        <div class="quiz-footer">
          <span>Punkty: ${score}</span>
          <span>Kliknij odpowiedź lub naciśnij A, B, C, D</span>
        </div>
      `;

      const container = document.getElementById('optionsContainer');
      qData.answers.forEach((ans, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-letter">${letters[idx]}</span> <span>${ans}</span>`;
        btn.onclick = () => handleAnswer(idx);
        container.appendChild(btn);
      });
    }

    function handleAnswer(selectedIdx) {
      if (selectedIdx === activeChar.questions[currentQ].correct) {
        score++;
      }
      currentQ++;
      if (currentQ < activeChar.questions.length) {
        renderQuestion();
      } else {
        renderResult();
      }
    }

    function renderResult() {
      window.removeEventListener('keydown', handleKeyPress);
      const passed = score >= 2;
      const modalBody = document.getElementById('modalBody');

      if (passed) {
        if (!userState.completed.includes(activeChar.id)) {
          userState.completed.push(activeChar.id);
          saveState();
        }
      }

      modalBody.innerHTML = `
        <div class="quiz-result">
          <h3>${passed ? '🎉 Gratulacje!' : '❌ Niestety...'}</h3>
          <p>Twój wynik: <strong>${score}/4</strong></p>
          <p style="margin-top:10px; color: var(--text-dim)">
            ${passed 
              ? 'Udowodniłeś/aś, że płynie w Tobie czarodziejska krew. Kolejny kawałek układanki został odkryty!' 
              : 'Mugolski wynik... Musisz uzyskać minimum 2 poprawne odpowiedzi. Spróbuj ponownie!'}
          </p>
          <button class="option-btn" id="actionBtn" style="margin-top:20px; width:100%; justify-content:center;">
            ${passed ? 'Odbierz Fragment' : 'Spróbuj Ponownie'}
          </button>
        </div>
      `;

      document.getElementById('actionBtn').onclick = () => {
        if (passed) {
          closeQuiz();
        } else {
          startQuiz(activeChar);
        }
      };

      renderApp();
    }

    function setDevDay(day) {
      userState.devDayOffset = day;
      saveState();
      renderApp();
    }

    function resetProgress() {
      userState = { completed: [], devDayOffset: 0, startDate: new Date().getTime() };
      saveState();
      renderApp();
    }

    renderApp();
  </script>
</body>
</html>
